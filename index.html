<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OM DIGITAL E-SEVA KENDRA - Worker Management Software</title>
    <link rel="icon" type="image/jpeg" href="/om_logo.jpg" />
    <meta name="description" content="Professional MBOCWW Worker Management ERP for Registration, Renewal, Claims, Claim Payments & Commission Settlement, Reports, and Office Administration." />
    <meta property="og:title" content="OM DIGITAL E-SEVA KENDRA - Worker Management Software" />
    <meta property="og:description" content="Professional MBOCWW Worker Management ERP for Registration, Renewal, Claims, Claim Payments & Commission Settlement, Reports, and Office Administration." />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #2563eb; border-right-color: #06b6d4; animation: initSpin 1.1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;"></div>
          <div style="position: absolute; inset: 7px; border-radius: 50%; border: 2.5px solid transparent; border-bottom-color: #4f46e5; border-left-color: #38bdf8; animation: initSpinRev 0.85s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;"></div>
          <div style="width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #06b6d4); box-shadow: 0 0 12px rgba(37,99,235,0.7); animation: initPulse 1.4s ease-in-out infinite;"></div>
        </div>
        <div style="margin-top: 20px; font-weight: 800; font-size: 14px; letter-spacing: 1.5px; color: #0f172a; text-transform: uppercase;">
          OM DIGITAL E-SEVA KENDRA
        </div>
        <div style="margin-top: 4px; font-size: 12px; font-weight: 600; color: #64748b;">
          लोड होत आहे... (Loading application...)
        </div>
        <style>
          @keyframes initSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes initSpinRev { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
          @keyframes initPulse { 0%, 100% { transform: scale(0.8); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }
        </style>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
